name: Promote Baseline

on:
  push:
    branches: [master]
    paths:
      - "prompts/**"
      - "src/**"
      - "eval/benchmark.jsonl"
      - "eval/thresholds.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run eval to produce new baseline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m eval.run_eval --out eval/results/baseline.json

      - name: Open PR with updated baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eval/results/baseline.json
          if git diff --cached --quiet; then
            echo "No baseline change, skipping PR"
            exit 0
          fi
          branch="update-baseline-${{ github.run_number }}"
          git checkout -b "$branch"
          git commit -m "chore: update eval baseline"
          git push origin "$branch"
          gh pr create --title "chore: update eval baseline" \
            --body "Automated baseline refresh after ${{ github.sha }} merged to master." \
            --base master --head "$branch"
