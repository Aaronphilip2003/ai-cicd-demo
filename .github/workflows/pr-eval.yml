name: PR Eval Gate

on:
  pull_request:
    paths:
      - "prompts/**"
      - "src/**"
      - "eval/benchmark.jsonl"
      - "eval/thresholds.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run eval against benchmark
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m eval.run_eval --out eval/results/current.json

      - name: Compare against baseline
        id: compare
        continue-on-error: true
        run: python -m eval.compare

      - name: Post PR comment with results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('eval/results/pr_comment.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail job if gate was breached
        if: steps.compare.outcome == 'failure'
        run: |
          echo "Eval gate failed — see PR comment for details."
          exit 1
